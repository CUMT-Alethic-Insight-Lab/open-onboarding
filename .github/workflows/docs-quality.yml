name: Documentation quality

on:
  pull_request:
    paths:
      - "**.md"
      - "**.py"
      - "examples/requirements.txt"
      - ".github/workflows/docs-quality.yml"
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-and-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/requirements.txt
      - run: python -m pip install -r examples/requirements.txt
      - run: python scripts/check_docs.py
      - run: python -m py_compile examples/*.py scripts/check_docs.py
      - run: python examples/ml_tree_ensemble.py
      - run: python examples/dl_foundations.py gradient
      - run: python examples/dl_foundations.py attention
      - run: python examples/dl_foundations.py mlp
      - run: python examples/dl_foundations.py cnn
      - run: python examples/data_pipeline.py
      - run: python examples/efficient_ai.py

  external-links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # 202/403 can be anti-bot responses, not missing pages; 404 still fails and timeouts stay visible.
          args: --verbose --no-progress --retry-wait-time 5 --max-retries 3 --timeout 60 --accept 200,202,204,206,403 './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
